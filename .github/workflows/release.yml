name: Release

# Builds installers for every supported platform and attaches them to a
# GitHub Release.
#
# Triggered only by a version tag or a manual dispatch - never on ordinary
# pushes, because this repo is private and macOS runners bill at 10x.
#
# Cost note: both Linux RIDs are cross-published from one ubuntu runner, and
# both macOS RIDs from one macos runner, so this is 3 jobs rather than 5.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- version
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ linux
  linux:
    name: Linux (deb, rpm, tar.gz)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Package linux-x64
        run: ./build/linux/package.sh linux-x64 "${{ needs.version.outputs.version }}"

      - name: Package linux-arm64
        run: ./build/linux/package.sh linux-arm64 "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows (installer, zip)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Package win-x64
        shell: pwsh
        run: ./build/windows/package.ps1 -Rid win-x64 -Version "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ macos
  macos:
    name: macOS (dmg, arm64 + x64)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package osx-arm64
        run: ./build/macos/package.sh osx-arm64 "${{ needs.version.outputs.version }}"

      - name: Package osx-x64
        run: ./build/macos/package.sh osx-x64 "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish release
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          # workflow_dispatch runs have no tag yet - make one at this commit.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GitGui $VERSION" \
              --notes "Automated build of GitGui $VERSION.

          **Linux** — \`.deb\` (Debian/Ubuntu/Mint), \`.rpm\` (Fedora/RHEL/openSUSE), or the portable \`.tar.gz\`.
          **Windows** — run the \`-setup.exe\`, or unzip the portable build.
          **macOS** — open the \`.dmg\` and drag GitGui to Applications. The bundle is unsigned, so the first launch needs right-click → Open.

          This is a UI mockup: the interface is complete but no git operations are wired up yet." \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" dist/* --clobber
