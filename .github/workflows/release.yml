name: Release

# Builds installers for every supported platform and attaches them to a
# GitHub Release.
#
# Triggered only by a version tag or a manual dispatch - never on ordinary
# pushes. Packaging fourteen artifacts across three operating systems takes tens
# of minutes, and none of it tells you anything ci.yml hasn't already.
#
# Both Linux RIDs are cross-published from one ubuntu runner, and both macOS RIDs
# from one macos runner. The Flatpak is the exception: its build runs inside a
# sandbox using the runtime for the host architecture, so it cannot be
# cross-built and needs one runner per architecture of its own.
#
# contents: write below is the only elevated permission in this repository, and it
# is why this workflow must never gain a pull_request trigger - that would hand a
# release-publishing token to code from a fork.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- version
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # The tag names the artifacts; <Version> in the csproj is what the app
          # reports, and the Flatpak build never passes -p:Version because
          # Flathub would not either. Nothing downstream compares the two, so a
          # tag pushed before the bump would ship fourteen artifacts labelled one
          # version by an app that calls itself another - and it would look fine.
          . build/version.sh
          csproj="$(project_version .)"

          if [ "$version" != "$csproj" ]; then
              echo "::error::v$version was asked for, but the csproj says $csproj."
              echo "::error::Bump <Version> in src/GitGui/GitGui.csproj and tag that commit."
              exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------- test
  # ci.yml only runs on pushes to a branch, so a tag would otherwise reach the
  # packaging jobs untested. One cheap Linux job gates all three of them.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test GitGui.slnx --configuration Release

  # ------------------------------------------------------------------ linux
  linux:
    name: Linux (deb, rpm, tar.gz, AppImage)
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Package linux-x64
        run: ./build/linux/package.sh linux-x64 "${{ needs.version.outputs.version }}"

      - name: Package linux-arm64
        run: ./build/linux/package.sh linux-arm64 "${{ needs.version.outputs.version }}"

      # if-no-files-found only catches an empty dist. This catches a partial one -
      # package.sh exits 0 when fpm is absent, so a missing .deb and .rpm would
      # otherwise sail through as a green job.
      - name: Verify Linux artifacts
        run: ./build/verify-artifacts.sh "${{ needs.version.outputs.version }}" --dir dist linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- flatpak
  # One runner per architecture, because a Flatpak build happens inside a sandbox
  # running the runtime for the machine it is on - there is no cross-build.
  # fail-fast is off so a broken aarch64 build still leaves an x86_64 one to look
  # at, which is most of what tells you whether the problem is the architecture.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      # No setup-dotnet here: the SDK comes from the Flatpak extension, inside
      # the sandbox. A .NET on the runner would not be visible to the build and
      # would only make it look as though the version on the runner mattered.
      - name: Install flatpak and the builder
        run: |
          sudo apt-get update
          # dbus for dbus-run-session: a runner has no session bus, and every
          # flatpak run needs one. Both scripts make their own with it.
          sudo apt-get install -y --no-install-recommends flatpak dbus
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.flatpak.Builder \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.dotnet10//25.08

      # Catches a PackageReference bumped without regenerating the offline NuGet
      # lists, before spending twenty minutes finding out the same thing from a
      # restore error. ci.yml runs this too, on every push.
      - name: Check the offline NuGet lists
        run: ./build/linux/flatpak/check-nuget-sources.sh

      - name: Package
        run: ./build/linux/flatpak/package.sh "${{ needs.version.outputs.version }}"

      # Runs after packaging because it lints the exported repository as well as
      # the manifest, and that only exists once the build has happened. It is the
      # same linter Flathub runs on a submission.
      - name: Validate the manifest and the build
        run: ./build/linux/flatpak/validate.sh --repo

      # package.sh exits 0 when flatpak is missing, same as the others.
      - name: Verify the Flatpak artifact
        run: ./build/verify-artifacts.sh "${{ needs.version.outputs.version }}" --dir dist flatpak-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows (installer, zip)
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Package win-x64
        shell: pwsh
        run: ./build/windows/package.ps1 -Rid win-x64 -Version "${{ needs.version.outputs.version }}"

      # bash, not pwsh: the checker is one script shared by all three runners.
      # Invoked through bash rather than executed, since the exec bit is the one
      # thing about a checkout that doesn't survive Windows.
      - name: Verify Windows artifacts
        shell: bash
        run: bash ./build/verify-artifacts.sh "${{ needs.version.outputs.version }}" --dir dist windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ macos
  macos:
    name: macOS (dmg, arm64 + x64)
    needs: [version, test]
    runs-on: macos-latest

    # Four notarisations - the .app and the .dmg, for each of two architectures -
    # and each is a wait on Apple's service rather than on this runner. Usually
    # a couple of minutes each; occasionally far longer, and a queue on their
    # side is not a reason to throw away a release that had otherwise built.
    timeout-minutes: 90

    # Read by build/macos/sign.sh. Absent on a fork, where secrets do not exist -
    # the build stays unsigned there rather than failing, which is what keeps a
    # pull request from a fork able to prove it compiles.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package osx-arm64
        run: ./build/macos/package.sh osx-arm64 "${{ needs.version.outputs.version }}"

      - name: Package osx-x64
        run: ./build/macos/package.sh osx-x64 "${{ needs.version.outputs.version }}"

      - name: Verify macOS artifacts
        run: ./build/verify-artifacts.sh "${{ needs.version.outputs.version }}" --dir dist macos

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish release
    needs: [version, linux, flatpak, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          ls -la dist

      # Everything the three build jobs made should now be in one directory.
      # Checked before uploading so a lost artifact is reported as that, rather
      # than as whatever the upload does about a file it never saw.
      - name: Verify everything arrived
        run: ./build/verify-artifacts.sh "${{ needs.version.outputs.version }}" --dir dist all

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          # workflow_dispatch runs have no tag yet - make one at this commit.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "GitGui $VERSION" \
              --notes "Automated build of GitGui $VERSION.

          ## Install

          **Linux** — \`.deb\` (Debian/Ubuntu/Mint), \`.rpm\` (Fedora/RHEL/openSUSE), \`.flatpak\` (\`flatpak install ./GitGui-${VERSION}-x86_64.flatpak\`), the \`.AppImage\` (anywhere else — \`chmod +x\` it and run it, no install), or the portable \`.tar.gz\`.
          **Windows** — run the \`-setup.exe\`, or unzip the portable build.
          **macOS** — open the \`.dmg\` and drag GitGui to Applications.

          The macOS builds are signed and notarised — the \`.dmg\` opens and GitGui launches with nothing to click past. The Windows builds are unsigned, so the first launch needs one nudge: click *More info* → *Run anyway*, and for the portable \`.zip\` you may also need right-click the \`.exe\` → *Properties* → **Unblock**.

          **No git installation is required.** The native libgit2 library ships inside the app, along with everything else it needs.

          ## Getting started

          Add a clone you already have from the **+** in the header, or sign in under **Settings → Accounts** and clone one straight from that menu's *Clone from a hosting site…* entry. GitHub supports browser sign-in; anywhere else takes a personal access token. Tokens go to your OS keychain, never to a settings file.

          Beyond the usual staging, committing, branching and fetch/push/pull: switching branches with uncommitted work asks whether to bring it along or stash it, the app notices changes made outside it, and hosting sites other than GitHub, Gitea and GitLab can be added under **Settings → Hosting sites** without writing any code — or by hand, see docs/host-manifests.md.

          ## Not in this build

          Pull requests and issues." \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" dist/* --clobber

      # The step above has exited 0 while quietly failing to upload two of the
      # twelve assets, which is how v0.2.0 first shipped with no .deb at all.
      # The files were on disk and the command was happy, so nothing short of
      # asking the release what it ended up with would have noticed.
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if ./build/verify-artifacts.sh "$VERSION" --release "$TAG"; then
            exit 0
          fi

          echo "Re-uploading, then checking again before giving up."
          gh release upload "$TAG" dist/* --clobber
          ./build/verify-artifacts.sh "$VERSION" --release "$TAG"
