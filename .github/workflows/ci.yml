name: CI

# Deliberately Linux-only and build-only. Actions minutes are free on a public
# repo, but a three-platform matrix on every push still costs several minutes of
# waiting for a result that is almost always identical - the code is one codebase
# with no per-platform branches. The full matrix lives in release.yml, where a
# platform-specific break would actually ship, and runs on a tag or a manual
# dispatch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository. Stated explicitly rather than left to the
# repository default, because pull_request runs from forks execute contributor code
# and the token they get should be able to do nothing but read.
permissions:
  contents: read

# A newer push to the same branch cancels the older run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GitGui.slnx

      - name: Build
        run: dotnet build GitGui.slnx --configuration Release --no-restore

      # Pure functions only, so this needs no display, no network and no git.
      - name: Test
        run: dotnet test GitGui.slnx --configuration Release --no-build --verbosity normal
