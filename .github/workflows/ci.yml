name: CI

# Deliberately Linux-only and build-only. This repo is private, so Actions
# minutes are metered - the expensive multi-platform matrix lives in
# release.yml and only runs on a tag or a manual dispatch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GitGui.slnx

      - name: Build
        run: dotnet build GitGui.slnx --configuration Release --no-restore

      # Pure functions only, so this needs no display, no network and no git.
      - name: Test
        run: dotnet test GitGui.slnx --configuration Release --no-build --verbosity normal
